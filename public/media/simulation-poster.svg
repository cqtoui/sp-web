<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Cyber Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1015"/>
      <stop offset="50%" stop-color="#1D1D18"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D0E12" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sora { font-family: 'Sora', 'Inter', sans-serif; }
    .font-mono { font-family: 'Space Mono', 'Fira Code', monospace; }
    .text-cyan { fill: #00E5FF; }
    .text-orange { fill: #FF5500; }
    .text-green { fill: #00FF66; }
    .text-dim { fill: #A0A5B5; font-size: 11px; }
    .card-border-cyan { stroke: #00E5FF; stroke-width: 1; stroke-opacity: 0.4; }
    .card-border-orange { stroke: #FF5500; stroke-width: 1; stroke-opacity: 0.4; }
  </style>

  <!-- Transparent poster: artwork only, no filled canvas -->

  <!-- ================= TOP HEADER SECTION ================= -->
  <g transform="translate(40, 30)">
    <!-- Brand Logo Monogram -->
    <g transform="translate(0, 0)">
      <polygon points="25,0 50,25 25,50 0,25" fill="none" stroke="#FF5500" stroke-width="2.5" filter="url(#glowOrange)"/>
      <polygon points="25,8 42,25 25,42 8,25" fill="none" stroke="#00E5FF" stroke-width="1.8"/>
      <path d="M25,15 L25,35 M15,25 L35,25" stroke="#00E5FF" stroke-width="2.5"/>
    </g>

    <!-- Header Text -->
    <text x="65" y="20" class="font-sora" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="1">AI SIMULATION CHAMBER</text>
    <text x="65" y="38" class="font-mono text-cyan" font-size="10" letter-spacing="1.5">ADAPTIVE EMERGENCY PROTOCOL ENGINE</text>

    <!-- RESERVED EMPTY SPACE FOR MANUAL LOGO INSERTION -->
  </g>

  <!-- Big Punchy Gen-Z Tagline -->
  <g transform="translate(40, 125)">
    <text x="0" y="32" class="font-sora text-orange" font-weight="900" font-size="38" letter-spacing="-1px" filter="url(#glowOrange)">PANIC LESS. SAVE MORE.</text>
    <text x="0" y="58" class="font-sora" font-weight="400" font-size="15" fill="#D0D5E0">Next-Gen VR Emergency Simulation Powered by Adaptive AI</text>
  </g>

  <!-- ================= HERO SECTION ================= -->
  <g transform="translate(40, 205)">
    <rect width="320" height="230" rx="12" fill="url(#heroCardGrad)" class="card-border-orange"/>
    <text x="20" y="35" class="font-sora text-orange" font-weight="700" font-size="14">THE REALITY CHECK</text>
    <text x="20" y="60" class="font-sora" font-size="12" fill="#E2E8F0">
      <tspan x="20" dy="0">Textbooks don't prepare you for panic.</tspan>
      <tspan x="20" dy="18">In actual crises—aviation accidents,</tspan>
      <tspan x="20" dy="18">choking, or fires— hesitation costs lives.</tspan>
    </text>
    
    <line x1="20" y1="115" x2="300" y2="115" stroke="#FF5500" stroke-opacity="0.2" stroke-width="1"/>

    <text x="20" y="140" class="font-sora text-cyan" font-weight="700" font-size="14">THE SOLUTION</text>
    <text x="20" y="165" class="font-sora" font-size="12" fill="#E2E8F0">
      <tspan x="20" dy="0">An immersive VR training ground that</tspan>
      <tspan x="20" dy="18">subjects you to dynamic stress factors,</tspan>
      <tspan x="20" dy="18">building real step-by-step muscle memory.</tspan>
    </text>
  </g>

  <g transform="translate(380, 205)">
    <rect width="380" height="230" rx="12" fill="#12151D" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="190" cy="115" r="75" fill="#00E5FF" fill-opacity="0.05"/>
    <rect x="130" y="85" width="120" height="45" rx="10" fill="#0A0B0E" stroke="#00E5FF" stroke-width="2" filter="url(#glowCyan)"/>
    <path d="M140,107 L240,107" stroke="#FF5500" stroke-width="2"/>
    <text x="155" y="102" class="font-mono text-cyan" font-size="9">SPATIAL HUD V2.4</text>

    <g transform="translate(15, 20)">
      <rect width="110" height="40" rx="6" fill="#0A0B0E" fill-opacity="0.8" stroke="#00FF66" stroke-width="1"/>
      <text x="10" y="16" class="font-mono text-green" font-size="8">PULSE RATE</text>
      <text x="10" y="32" class="font-mono" font-size="14" fill="#FFFFFF" font-weight="700">132 BPM</text>
    </g>

    <g transform="translate(255, 170)">
      <rect width="110" height="40" rx="6" fill="#0A0B0E" fill-opacity="0.8" stroke="#FF5500" stroke-width="1"/>
      <text x="10" y="16" class="font-mono text-orange" font-size="8">CRISIS TIMER</text>
      <text x="10" y="32" class="font-mono text-orange" font-size="14" font-weight="700">00:42.8s</text>
    </g>

    <circle cx="320" cy="50" r="15" fill="none" stroke="#00E5FF" stroke-dasharray="3,3"/>
    <line x1="320" y1="30" x2="320" y2="70" stroke="#00E5FF" stroke-opacity="0.4"/>
    <line x1="300" y1="50" x2="340" y2="50" stroke="#00E5FF" stroke-opacity="0.4"/>
  </g>

  <!-- ================= 5 CORE MECHANICS ================= -->
  <g transform="translate(40, 460)">
    <text x="0" y="15" class="font-sora" font-weight="700" font-size="16" fill="#FFFFFF">SYSTEM CAPABILITIES</text>

    <g transform="translate(0, 30)">
      <rect width="136" height="110" rx="8" fill="#151922" class="card-border-cyan"/>
      <text x="12" y="28" class="font-mono text-cyan" font-size="18">⚡</text>
      <text x="12" y="52" class="font-sora text-cyan" font-weight="700" font-size="11">DYNAMIC AI</text>
      <text x="12" y="68" class="font-sora text-dim">Adapts plot &amp;</text>
      <text x="12" y="82" class="font-sora text-dim">difficulty live</text>
    </g>

    <g transform="translate(146, 30)">
      <rect width="136" height="110" rx="8" fill="#151922" class="card-border-cyan"/>
      <text x="12" y="28" class="font-mono text-cyan" font-size="18">📍</text>
      <text x="12" y="52" class="font-sora text-cyan" font-weight="700" font-size="11">LOCAL SYNC</text>
      <text x="12" y="68" class="font-sora text-dim">Regional emergency</text>
      <text x="12" y="82" class="font-sora text-dim">numbers &amp; rules</text>
    </g>

    <g transform="translate(292, 30)">
      <rect width="136" height="110" rx="8" fill="#151922" class="card-border-orange"/>
      <text x="12" y="28" class="font-mono text-orange" font-size="18">⚖️</text>
      <text x="12" y="52" class="font-sora text-orange" font-weight="700" font-size="11">BIOMETRICS</text>
      <text x="12" y="68" class="font-sora text-dim">Custom physical</text>
      <text x="12" y="82" class="font-sora text-dim">height/weight rules</text>
    </g>

    <g transform="translate(438, 30)">
      <rect width="136" height="110" rx="8" fill="#151922" class="card-border-orange"/>
      <text x="12" y="28" class="font-mono text-orange" font-size="18">🎧</text>
      <text x="12" y="52" class="font-sora text-orange" font-weight="700" font-size="11">STRESS CUES</text>
      <text x="12" y="68" class="font-sora text-dim">Auditory anxiety &amp;</text>
      <text x="12" y="82" class="font-sora text-dim">panic stimulation</text>
    </g>

    <g transform="translate(584, 30)">
      <rect width="136" height="110" rx="8" fill="#151922" class="card-border-cyan"/>
      <text x="12" y="28" class="font-mono text-cyan" font-size="18">🧠</text>
      <text x="12" y="52" class="font-sora text-cyan" font-weight="700" font-size="11">RL MODELING</text>
      <text x="12" y="68" class="font-sora text-dim">Instant dynamic</text>
      <text x="12" y="82" class="font-sora text-dim">consequences</text>
    </g>
  </g>

  <!-- ================= HOW IT WORKS & SCENARIOS ================= -->
  <g transform="translate(40, 630)">
    <rect width="250" height="340" rx="10" fill="#12141C" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="30" class="font-mono text-cyan" font-weight="700" font-size="13">// SIMULATION LOOP</text>

    <g transform="translate(20, 50)">
      <circle cx="12" cy="12" r="12" fill="#FF5500"/>
      <text x="12" y="16" class="font-mono" font-size="10" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="35" y="10" class="font-sora" font-size="11" font-weight="700" fill="#FFFFFF">CRISIS SELECTION</text>
      <text x="35" y="24" class="font-sora text-dim">Choose emergency event</text>

      <line x1="12" y1="28" x2="12" y2="48" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2,2"/>

      <g transform="translate(0, 50)">
        <circle cx="12" cy="12" r="12" fill="#151922" stroke="#00E5FF"/>
        <text x="12" y="16" class="font-mono text-cyan" font-size="10" text-anchor="middle">2</text>
        <text x="35" y="10" class="font-sora" font-size="11" font-weight="700" fill="#FFFFFF">VR IMMERSION</text>
        <text x="35" y="24" class="font-sora text-dim">Enter high-stress 3D space</text>
      </g>

      <line x1="12" y1="78" x2="12" y2="98" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2,2"/>

      <g transform="translate(0, 100)">
        <circle cx="12" cy="12" r="12" fill="#151922" stroke="#00E5FF"/>
        <text x="12" y="16" class="font-mono text-cyan" font-size="10" text-anchor="middle">3</text>
        <text x="35" y="10" class="font-sora" font-size="11" font-weight="700" fill="#FFFFFF">ADAPTIVE ACTION</text>
        <text x="35" y="24" class="font-sora text-dim">AI adjusts to decisions</text>
      </g>

      <line x1="12" y1="128" x2="12" y2="148" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2,2"/>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#151922" stroke="#00E5FF"/>
        <text x="12" y="16" class="font-mono text-cyan" font-size="10" text-anchor="middle">4</text>
        <text x="35" y="10" class="font-sora" font-size="11" font-weight="700" fill="#FFFFFF">RL FEEDBACK</text>
        <text x="35" y="24" class="font-sora text-dim">Real-time outcome metrics</text>
      </g>

      <line x1="12" y1="178" x2="12" y2="198" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2,2"/>

      <g transform="translate(0, 200)">
        <circle cx="12" cy="12" r="12" fill="#00FF66"/>
        <text x="12" y="16" class="font-mono" font-size="10" fill="#000000" text-anchor="middle">5</text>
        <text x="35" y="10" class="font-sora text-green" font-size="11" font-weight="700">MUSCLE MEMORY</text>
        <text x="35" y="24" class="font-sora text-dim">Master life-saving steps</text>
      </g>
    </g>
  </g>

  <g transform="translate(310, 630)">
    <rect width="450" height="195" rx="10" fill="#12141C" stroke="#FF5500" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="30" class="font-mono text-orange" font-weight="700" font-size="13">[SIMULATED CRISES &amp; OUTCOMES]</text>

    <g transform="translate(20, 50)">
      <text x="0" y="15" class="font-sora text-cyan" font-size="12" font-weight="700">MODELS INCLUDED:</text>
      <text x="0" y="35" class="font-sora" font-size="11" fill="#E2E8F0">• Aviation Incidents &amp; Cabin Pressure</text>
      <text x="0" y="55" class="font-sora" font-size="11" fill="#E2E8F0">• Cardiac Arrest &amp; CPR Timing</text>
      <text x="0" y="75" class="font-sora" font-size="11" fill="#E2E8F0">• Severe Physical Trauma &amp; Hemorrhage</text>
      <text x="0" y="95" class="font-sora" font-size="11" fill="#E2E8F0">• Structural Fire &amp; Smoke Navigation</text>
    </g>

    <g transform="translate(240, 50)">
      <text x="0" y="15" class="font-sora text-green" font-size="12" font-weight="700">TRAINING GAINS:</text>
      <text x="0" y="35" class="font-sora" font-size="11" fill="#E2E8F0">• Overcome Freeze Response</text>
      <text x="0" y="55" class="font-sora" font-size="11" fill="#E2E8F0">• Fast Decision Velocity</text>
      <text x="0" y="75" class="font-sora" font-size="11" fill="#E2E8F0">• Stress Tolerance Build-up</text>
      <text x="0" y="95" class="font-sora" font-size="11" fill="#E2E8F0">• Precise Step Sequences</text>
    </g>
  </g>

  <!-- Tech Stack Terminal Block -->
  <g transform="translate(310, 840)">
    <rect width="450" height="130" rx="8" fill="#0A0B0E" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
    <rect width="450" height="24" rx="8" fill="#151922"/>
    <circle cx="15" cy="12" r="4" fill="#FF5F56"/>
    <circle cx="28" cy="12" r="4" fill="#FFBD2E"/>
    <circle cx="41" cy="12" r="4" fill="#27C93F"/>
    <text x="60" y="16" class="font-mono text-dim" font-size="9">tech_stack_config.json</text>

    <text x="20" y="48" class="font-mono" font-size="10" fill="#00E5FF">"engines": <tspan fill="#FFFFFF">["Unity (C#)", "Unreal Engine (C++)"]</tspan>,</text>
    <text x="20" y="66" class="font-mono" font-size="10" fill="#00E5FF">"ai_core": <tspan fill="#FFFFFF">["OpenAI API", "LangChain", "PyTorch"]</tspan>,</text>
    <text x="20" y="84" class="font-mono" font-size="10" fill="#00E5FF">"data_sources": <tspan fill="#FFFFFF">["Red Cross Protocols", "WHO Datasets"]</tspan>,</text>
    <text x="20" y="102" class="font-mono" font-size="10" fill="#00E5FF">"platform": <tspan fill="#00FF66">"VR Headset / Spatial Computing"</tspan></text>
  </g>

  <!-- ================= FOOTER CTA BAR ================= -->
  <g transform="translate(40, 995)">
    <rect width="720" height="85" rx="12" fill="#12151D" stroke="#FF5500" stroke-width="1.5" filter="url(#glowOrange)"/>
    
    <text x="25" y="32" class="font-sora" font-weight="800" font-size="15" fill="#FFFFFF">AI SIMULATION CHAMBER</text>
    <text x="25" y="50" class="font-sora text-dim" font-size="11">Applied Technology Schools (ATS) — Baniyas Campus</text>
    <text x="25" y="66" class="font-mono text-cyan" font-size="9">CAPSTONE PROJECT // PUBLIC SAFETY &amp; RESILIENCE</text>

    <g transform="translate(635, 14)">
      <rect width="56" height="56" fill="#FFFFFF" rx="4"/>
      <rect x="5" y="5" width="20" height="20" fill="#000000"/>
      <rect x="8" y="8" width="14" height="14" fill="#FFFFFF"/>
      <rect x="11" y="11" width="8" height="8" fill="#000000"/>

      <rect x="31" y="5" width="20" height="20" fill="#000000"/>
      <rect x="34" y="8" width="14" height="14" fill="#FFFFFF"/>
      <rect x="37" y="11" width="8" height="8" fill="#000000"/>

      <rect x="5" y="31" width="20" height="20" fill="#000000"/>
      <rect x="8" y="34" width="14" height="14" fill="#FFFFFF"/>
      <rect x="11" y="37" width="8" height="8" fill="#000000"/>

      <rect x="31" y="31" width="8" height="8" fill="#000000"/>
      <rect x="43" y="43" width="8" height="8" fill="#000000"/>
      <rect x="43" y="31" width="8" height="8" fill="#FF5500"/>
    </g>

    <text x="545" y="38" class="font-mono text-cyan" font-size="8" text-anchor="end">SCAN TO EXPERIENCE</text>
    <text x="545" y="50" class="font-mono text-orange" font-size="10" font-weight="700" text-anchor="end">DEMO CHAMBER</text>
  </g>
</svg>
